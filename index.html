<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13181B" />
    <!-- Meta Pixel is initialized in client JS (src/lib/track.ts) from
         import.meta.env.VITE_META_PIXEL_ID, so the HTML has no build-time env
         tokens to replace. -->

    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="וובינר לייב בזום: לומדים בפרקטיקה איך לאתר, לנתח ולהגיש הצעה ראשונה על נכס בארה״ב, בשעה אחת בלייב, בלי תוכנות יקרות ובלי תיאוריות. יום שלישי, 13 באוקטובר, 18:00. ההשתתפות חינם, מספר המקומות מוגבל."
    />

    <!-- Open Graph / social + WhatsApp preview -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="וובינר מנוע העסקאות ל2 נכסים בחודש · אוהד עוז" />
    <meta property="og:title" content="וובינר מנוע העסקאות ל2 נכסים בחודש" />
    <meta
      property="og:description"
      content="שעה אחת של עבודה מעשית בלייב עם יזם נדל״ן פעיל בארה״ב, יוצאים עם הצעה מוכנה להגשה. מספר המקומות מוגבל."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/images/og-cover.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/images/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="וובינר מנוע העסקאות ל2 נכסים בחודש" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="וובינר מנוע העסקאות ל2 נכסים בחודש" />
    <meta
      name="twitter:description"
      content="שעה אחת של עבודה מעשית בלייב עם יזם נדל״ן פעיל בארה״ב, יוצאים עם הצעה מוכנה להגשה."
    />
    <meta name="twitter:image" content="__SITE_URL__/images/og-cover.jpg" />
    <meta name="twitter:image:alt" content="וובינר מנוע העסקאות ל2 נכסים בחודש" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>וובינר מנוע העסקאות ל2 נכסים בחודש</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
