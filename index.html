<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13181B" />
    <!-- Meta Pixel is initialized in client JS (src/lib/track.ts) from
         import.meta.env.VITE_META_PIXEL_ID, so the HTML has no build-time env
         tokens to replace. -->

    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="עסקאות אמיתיות, ניתוחי נכסים, שאלות ותשובות וקשרים עם אנשי מקצוע בשטח. קהילת WhatsApp סגורה למשקיעים ויזמי נדל״ן בארה״ב, הצטרפות חינם."
    />

    <!-- Open Graph / social + WhatsApp preview -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="קהילת משקיעי הנדל״ן בארה״ב · אוהד עוז" />
    <meta property="og:title" content="קהילת WhatsApp סגורה למשקיעים ויזמי נדל״ן בארה״ב" />
    <meta
      property="og:description"
      content="עסקאות אמיתיות, ניתוחי נכסים וקשרים עם אנשי מקצוע בשטח. הצטרפות חינם בלחיצה אחת."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/images/og-cover.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/images/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="קהילת WhatsApp סגורה למשקיעים ויזמי נדל״ן בארה״ב" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="קהילת WhatsApp סגורה למשקיעים ויזמי נדל״ן בארה״ב" />
    <meta
      name="twitter:description"
      content="עסקאות אמיתיות, ניתוחי נכסים וקשרים עם אנשי מקצוע בשטח. הצטרפות חינם בלחיצה אחת."
    />
    <meta name="twitter:image" content="__SITE_URL__/images/og-cover.jpg" />
    <meta name="twitter:image:alt" content="קהילת WhatsApp סגורה למשקיעים ויזמי נדל״ן בארה״ב" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>קהילת WhatsApp סגורה למשקיעים ויזמי נדל״ן בארה״ב · הצטרפות חינם</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
